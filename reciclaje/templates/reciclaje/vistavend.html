<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lormetal Móvil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-success shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-decoration-none" href="{% url 'vstavnde' %}">
                Lormetal Móvil
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuMovil">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse mt-3" id="menuMovil">
                <div class="text-center pb-2">
                    <p class="text-white mb-3 fs-6">
                        Usuario: <strong>{{ request.user.username }}</strong>
                    </p>
                    
                    <a href="{% url 'logout' %}" class="btn btn-danger w-100 fw-bold shadow-sm py-2">
                        Cerrar Sesión
                    </a>
                </div>
            </div>
            
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
