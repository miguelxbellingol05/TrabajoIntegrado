<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administradores - Lormetal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .navbar-dark .navbar-nav .nav-link.active {
            color: #fff !important;
            font-weight: bold;
            border-bottom: 2px solid #fff; /* Le añade una línea sutil blanca abajo al estar seleccionado */
        }
    </style>
</head>
<body class="bg-light">


    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand mb-0 h1 text-white me-4" href="{%url 'adm_home'%}">Hola Administradores</a>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                
                <div class="navbar-nav me-auto align-items-center">
                    <a class="nav-link {% if request.resolver_match.url_name == 'create' %}text-white active{% else %}text-white-50{% endif %}" 
                       href="{% url 'create' %}">
                       Registrar empleados
                    </a>
                    <a class="nav-link {% if request.resolver_match.url_name == 'vistaepds' or request.resolver_match.url_name == 'acualizar_empleado' %}text-white active{% else %}text-white-50{% endif %}" 
                       href="{% url 'vistaepds' %}">
                       Lista empleados
                    </a>
                </div>

                <div class="navbar-nav ms-auto">
                    {% if request.user.is_authenticated %}
                        <a class="btn btn-outline-danger btn-sm px-3" href="{% url 'logout' %}">Logout</a>
                    {% else %}
                        <a class="btn btn-outline-primary btn-sm px-3" href="{% url 'login' %}">Login</a>
                    {% endif %}
                </div>

            </div>
        </div>
    </nav>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </main>
    <div class="toast-container position-fixed bottom-0 start-0 p-3" style="z-index: 1100;">
        
        {% if messages %}
            {% for message in messages %}
                <div class="toast align-items-center text-white {% if message.tags == 'success' %}bg-success{% elif message.tags == 'error' %}bg-danger{% else %}bg-dark{% endif %} border-0" 
                     role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex">
                        <div class="toast-body">
                            {{ message }} </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>
            {% endfor %}
        {% endif %}

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var toastElList = [].slice.call(document.querySelectorAll('.toast'))
            var toastList = toastElList.map(function (toastEl) {
                return new bootstrap.Toast(toastEl, { delay: 4000 }).show() 
            })
        })
    </script>
</body>
</html>
