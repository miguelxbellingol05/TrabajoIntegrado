{% extends 'reciclaje/vistadm.html' %}

{% block content %}
<div class="card p-4 shadow-sm border-0 mt-3">
    <div class="card-body">
        <h3 class="card-title text-primary mb-4">Editar Datos del Empleado</h3>
        <h6 class="text-muted mb-4">Modificando el perfil de: <strong>{{ usuario.nombre }} {{ usuario.apellido }}</strong></h6>
        
        <form method="POST" class="needs-validation">
            {% csrf_token %}
            
            <div class="mb-3">
                {{ form.as_p }}
            </div>
            
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-success px-4">Guardar Cambios</button>
                <a href="{% url 'vistaepds' %}" class="btn btn-secondary px-4">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
